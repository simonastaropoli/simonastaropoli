<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Prossimi Incontri</title>
    <link rel="stylesheet" href="style.css"> <!-- Assicurati che il percorso del tuo CSS sia corretto -->
</head>
<body>

    <!-- Header / Navigazione -->
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="calendario.html">Calendario Completo</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <!-- Contenuto Principale -->
        <section class="content">
            <h1>Benvenuti</h1>
            <p>Consulta i nostri prossimi eventi e incontri direttamente dalla barra laterale o visita la pagina dedicata.</p>
        </section>

        <!-- Sidebar con Automazione Dinamica -->
        <aside class="sidebar">
            <div class="widget">
                <h3>Prossimi Incontri</h3>
                <ul id="upcoming-events-list">
                    <!-- Gli eventi verranno caricati automaticamente da calendario.html -->
                    <li>Caricamento incontri...</li>
                </ul>
            </div>
        </aside>
    </main>

    <!-- Script di Automazione 100% -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        fetch('calendario.html')
            .then(response => {
                if (!response.ok) throw new Error('Impossibile caricare calendario.html');
                return response.text();
            })
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // Seleziona gli elementi dal file calendario.html
                const items = doc.querySelectorAll('.calendar-item');
                const sidebarContainer = document.getElementById('upcoming-events-list');
                
                if (!sidebarContainer) return;
                sidebarContainer.innerHTML = ''; // Pulisce il testo di caricamento

                let conteggio = 0;

                items.forEach(item => {
                    if (conteggio >= 3) return; // Limita l'esposizione ai primi 3 eventi

                    // Estrazione dati dinamica dalla pagina calendario.html
                    const title = item.querySelector('h3')?.innerText || 'Incontro';
                    const link = item.querySelector('a[href*="wa.me"]')?.href || 'calendario.html';
                    const descText = item.querySelector('p')?.innerText || '';
                    
                    // Troncamento testo a 65 caratteri
                    const shortDesc = descText.length > 65 ? descText.substring(0, 65) + '...' : descText;

                    // Creazione elemento HTML per la sidebar
                    const li = document.createElement('li');
                    li.className = 'upcoming-event-item';
                    li.innerHTML = `
                        <div class="event-info">
                            <strong><a href="${link}" target="_blank" rel="noopener">${title}</a></strong>
                            <p>${shortDesc}</p>
                        </div>
                    `;
                    
                    sidebarContainer.appendChild(li);
                    conteggio++;
                });

                // Fallback nel caso in cui non ci siano eventi in calendario.html
                if (conteggio === 0) {
                    sidebarContainer.innerHTML = '<li>Nessun prossimo incontro in programma.</li>';
                }
            })
            .catch(err => {
                console.error('Errore durante la sincronizzazione dinamica:', err);
                const sidebarContainer = document.getElementById('upcoming-events-list');
                if (sidebarContainer) {
                    sidebarContainer.innerHTML = '<li>Impossibile caricare gli eventi al momento.</li>';
                }
            });
    });
    </script>
</body>
</html>
